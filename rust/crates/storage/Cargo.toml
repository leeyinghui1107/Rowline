[package]
name = "rowline-storage"
description = "Persistence: text save files, the legacy importer and the on-disk store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rowline-core = { path = "../core" }
rowline-platform = { path = "../platform" }

[features]
default = []
# Write to the real file system instead of the in-memory one.
fs = ["rowline-platform/fs"]
