[package]
name = "rowline-assets"
description = "Asset loading: sprite sheets, fonts and data files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rowline-core.workspace = true
rowline-display.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

[features]
default = []
# Decode formats beyond PNG.
jpg = ["image/jpeg"]
bmp = ["image/bmp"]
