[package]
name = "rowline-platform"
description = "Platform abstraction: windows, input, clock and file system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rowline-core.workspace = true

[features]
default = []
# Real windowing via winit.  Off by default so the workspace stays
# dependency-light for CI, head-less replay and documentation builds.
winit = ["dep:winit"]
# Use a real on-disk file system instead of the in-memory stub.
fs = []

[dependencies.winit]
version = "0.30"
optional = true
default-features = false
features = ["rwh_06", "x11", "wayland", "wayland-dlopen"]
