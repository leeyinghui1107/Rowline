[package]
name = "rowline-core"
description = "Rowline board model, rules, RNG and layout -- pure logic, no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Optional, derive-only: the crate stays dependency-free by default, which
# keeps the differential replay gate hermetic.
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
# Serialisation support for the save model.
serde = ["dep:serde"]
