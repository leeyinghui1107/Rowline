[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/display",
    "crates/theme",
    "crates/storage",
    "crates/platform",
    "crates/render",
    "crates/assets",
    "crates/app",
    "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Rowline contributors"]

[workspace.dependencies]
rowline-core = { path = "crates/core" }
rowline-display = { path = "crates/display" }
rowline-theme = { path = "crates/theme" }
rowline-storage = { path = "crates/storage" }
rowline-platform = { path = "crates/platform" }
rowline-render = { path = "crates/render" }
rowline-assets = { path = "crates/assets" }
rowline-app = { path = "crates/app" }

# The core crate has NO external dependencies on purpose:
#   * the differential replay gate must stay hermetic and reproducible
#   * the logic must be portable to no_std and to embedded targets later
#   * the behaviour spec (docs/03_FEATURE_SPEC.md) is the only contract
# The product is a single desktop binary: optimise it for size.  "z" shrinks
# the wgpu/naga code much further than 3; the game is not CPU bound, so the
# small speed cost is irrelevant.  Fat LTO removes dead cross-crate code and
# stripping drops the symbol table.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
