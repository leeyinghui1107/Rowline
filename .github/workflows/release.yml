name: Release build

# Builds the product on native runners, so the macOS binary is linked against
# the real Apple SDK and the Linux binary against glibc.  Triggered manually
# (tools/build_all.py uses `gh workflow run`), or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            artifact: rowline-linux-x86_64
          - name: macOS universal
            os: macos-latest
            platform: macos
            artifact: rowline-macos-universal
            universal: true
          - name: Windows x86_64
            os: windows-latest
            platform: windows
            artifact: rowline-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build and package (Linux / Windows)
        if: ${{ !matrix.universal }}
        run: python tools/package.py --out dist --zip

      - name: Build and package (macOS universal)
        if: ${{ matrix.universal }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          (cd rust && cargo build --release -p rowline-app --all-features \
             --target aarch64-apple-darwin)
          (cd rust && cargo build --release -p rowline-app --all-features \
             --target x86_64-apple-darwin)
          mkdir -p rust/target/universal
          lipo -create \
            rust/target/aarch64-apple-darwin/release/rowline \
            rust/target/x86_64-apple-darwin/release/rowline \
            -output rust/target/universal/rowline
          python tools/package.py --out dist \
            --binary rust/target/universal/rowline --zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Attach bundles to the tag
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Rowline $GITHUB_REF_NAME" \
              --generate-notes \
              release/*.zip release/SHA256SUMS.txt
          fi
